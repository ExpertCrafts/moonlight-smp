<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight SMP</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --mc-font: 'Press Start 2P', monospace;
      --mc-purple: #a78bfa;
      --mc-yellow: #ffff55;
      --mc-green: #55ff55;
      --mc-red: #ff5555;
      --mc-dark: #12161f;
      --mc-panel: #1a1f2c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--mc-font);
      image-rendering: pixelated;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: var(--mc-panel);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(124, 58, 237, 0.18), transparent 70%),
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('https://raw.githubusercontent.com/InventivotalentDev/minecraft-assets/1.20/assets/minecraft/textures/block/deepslate.png');
      background-repeat: repeat;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px;
      min-height: 100vh;
      border: 12px solid #000;
      box-shadow: 
        inset -8px -8px 0px 0px #0f121a,
        inset 8px 8px 0px 0px #2a3144;
    }

    .header-section {
      text-align: center;
      margin-top: 10px;
    }

    .title {
      font-size: clamp(2rem, 5.5vw, 4rem);
      color: var(--mc-purple);
      text-shadow: 5px 5px 0px #2e1065;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .subtitle {
      color: #9ca3af;
      font-size: clamp(0.7rem, 1.8vw, 1rem);
      line-height: 1.6;
      text-shadow: 2px 2px 0px #000;
    }

    .main-content {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin: 20px 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background-color: var(--mc-dark);
      border: 4px solid #000;
      box-shadow: 
        inset -4px -4px 0px 0px #090b10,
        inset 4px 4px 0px 0px #212838;
      padding: 24px 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.65rem;
      color: #6b7280;
      text-shadow: 1px 1px 0px #000;
      margin-bottom: 14px;
    }

    .stat-value {
      font-size: 1rem;
      color: #fff;
      text-shadow: 2px 2px 0px #000;
    }

    .status-online { color: var(--mc-green); }
    .status-offline { color: var(--mc-red); }

    /* Pixelated Angled Action Bar */
    .angled-action-bar {
      display: flex;
      width: 100%;
      border: 6px solid #000;
      box-shadow: 0 12px 30px rgba(0,0,0,0.9);
      overflow: hidden;
      background-color: #000;
    }

    .angled-btn {
      flex: 1;
      color: #fff;
      padding: 28px 12px;
      font-size: clamp(0.85rem, 2vw, 1.2rem);
      text-shadow: 3px 3px 0px #000;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Pixel noise background textures generated dynamically via SVG filter */
    .ip-btn-bg {
      background-color: #3b1f24;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.08) 15%, transparent 16%),
        radial-gradient(rgba(0, 0, 0, 0.3) 15%, transparent 16%);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
    }

    .ip-btn-bg:hover {
      background-color: #50262e;
    }

    .discord-btn-bg {
      background-color: #5865F2;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.12) 15%, transparent 16%),
        radial-gradient(rgba(0, 0, 0, 0.25) 15%, transparent 16%);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
      clip-path: polygon(6% 0, 100% 0, 100% 100%, 0% 100%);
      margin-left: -20px;
      padding-left: 35px;
    }

    .discord-btn-bg:hover {
      background-color: #4752C4;
    }

    .btn-subtext {
      display: block;
      font-size: 0.6rem;
      color: var(--mc-yellow);
      text-shadow: 1px 1px 0px #000;
    }

    @media (max-width: 768px) {
      .angled-action-bar {
        flex-direction: column;
      }
      .discord-btn-bg {
        clip-path: none;
        margin-left: 0;
        padding: 24px 12px;
        border-top: 4px solid #000;
      }
    }
  </style>
</head>
<body>

  <div class="header-section">
    <h1 class="title">MOONLIGHT SMP</h1>
    <p class="subtitle">A brand new adventure is currently in development.</p>
  </div>

  <div class="main-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">STATUS</div>
        <div class="stat-value" id="status-val">Loading...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PLAYERS</div>
        <div class="stat-value" id="players-val">--/--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PING</div>
        <div class="stat-value" id="ping-val">-- ms</div>
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns: 1fr;">
      <div class="stat-card">
        <div class="stat-label">TARGET VERSION</div>
        <div class="stat-value" style="color: var(--mc-purple);">26.x</div>
      </div>
    </div>

    <div class="angled-action-bar">
      <button class="angled-btn ip-btn-bg" onclick="copyIp()">
        <span>SERVER IP</span>
        <span class="btn-subtext" id="ip-subtext">mc.hypixel.net</span>
      </button>

      <a href="https://discord.gg/v9fGkejqs" target="_blank" class="angled-btn discord-btn-bg">
        <span>DISCORD</span>
        <span class="btn-subtext">CLICK TO JOIN DISCORD</span>
      </a>
    </div>
  </div>

  <div></div>

  <script>
    const SERVER_IP = "mc.hypixel.net";

    async function fetchServerStatus() {
      const startTime = Date.now();
      try {
        const response = await fetch(`https://api.mcstatus.io/v2/status/java/${SERVER_IP}`);
        const latency = Date.now() - startTime;
        const data = await response.json();

        const statusVal = document.getElementById("status-val");
        const playersVal = document.getElementById("players-val");
        const pingVal = document.getElementById("ping-val");

        if (data.online) {
          statusVal.textContent = "ONLINE";
          statusVal.className = "stat-value status-online";
          playersVal.textContent = `${data.players.online}/${data.players.max}`;
          pingVal.textContent = `${latency} ms`;
        } else {
          statusVal.textContent = "OFFLINE";
          statusVal.className = "stat-value status-offline";
          playersVal.textContent = "0/0";
          pingVal.textContent = "N/A";
        }
      } catch (err) {
        document.getElementById("status-val").textContent = "ERROR";
      }
    }

    function copyIp() {
      navigator.clipboard.writeText(SERVER_IP);
      const subtext = document.getElementById("ip-subtext");
      subtext.textContent = "COPIED TO CLIPBOARD!";
      setTimeout(() => { subtext.textContent = SERVER_IP; }, 2000);
    }

    fetchServerStatus();
    setInterval(fetchServerStatus, 15000);
  </script>
</body>
</html>
