<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight SMP</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --mc-font: 'Press Start 2P', monospace;
      --mc-gold: #a78bfa;
      --mc-yellow: #ffff55;
      --mc-green: #55ff55;
      --mc-red: #ff5555;
      --mc-dark: #12161f;
      --mc-panel: #1a1f2c;
      --btn-dark: #3b1f24;
      --btn-hover: #50262e;
      --discord-color: #5865F2;
      --discord-hover: #4752C4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--mc-font);
      image-rendering: pixelated;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      background-color: #0b0e14;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(124, 58, 237, 0.15), transparent 70%),
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url('https://raw.githubusercontent.com/InventivotalentDev/minecraft-assets/1.20/assets/minecraft/textures/block/deepslate.png');
      background-repeat: repeat;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .mc-box {
      background-color: var(--mc-panel);
      border: 6px solid #000;
      box-shadow: 
        inset -6px -6px 0px 0px #0f121a,
        inset 6px 6px 0px 0px #2a3144,
        0px 20px 40px rgba(0,0,0,0.9);
      padding: 40px 32px;
      text-align: center;
    }

    .title {
      font-size: clamp(1.8rem, 4vw, 3rem);
      color: var(--mc-gold);
      text-shadow: 4px 4px 0px #2e1065;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .subtitle {
      color: #9ca3af;
      font-size: clamp(0.55rem, 1.2vw, 0.75rem);
      line-height: 1.8;
      margin-bottom: 32px;
      text-shadow: 2px 2px 0px #000;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--mc-dark);
      border: 4px solid #000;
      box-shadow: 
        inset -4px -4px 0px 0px #090b10,
        inset 4px 4px 0px 0px #212838;
      padding: 20px 12px;
    }

    .stat-label {
      font-size: 0.55rem;
      color: #6b7280;
      text-shadow: 1px 1px 0px #000;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 0.85rem;
      color: #fff;
      text-shadow: 2px 2px 0px #000;
    }

    .status-online { color: var(--mc-green); }
    .status-offline { color: var(--mc-red); }

    /* Pixelated Angled Action Bar */
    .angled-action-bar {
      display: flex;
      width: 100%;
      border: 6px solid #000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      overflow: hidden;
      background-color: #000;
      margin-top: 8px;
    }

    .angled-btn {
      flex: 1;
      background-color: var(--btn-dark);
      color: #fff;
      padding: 22px 10px;
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      text-shadow: 2px 2px 0px #000;
      border: none;
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: background-color 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .angled-btn:nth-child(2) {
      background-color: var(--discord-color);
      clip-path: polygon(6% 0, 100% 0, 100% 100%, 0% 100%);
      margin-left: -20px;
      padding-left: 30px;
    }

    .angled-btn:hover {
      background-color: var(--btn-hover);
    }

    .angled-btn:nth-child(2):hover {
      background-color: var(--discord-hover);
    }

    .btn-subtext {
      display: block;
      font-size: 0.5rem;
      color: var(--mc-yellow);
      text-shadow: 1px 1px 0px #000;
    }

    @media (max-width: 650px) {
      .angled-action-bar {
        flex-direction: column;
      }
      .angled-btn, .angled-btn:nth-child(2) {
        clip-path: none;
        margin-left: 0;
        padding: 18px;
        border-bottom: 4px solid #000;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="mc-box">
      <h1 class="title">MOONLIGHT SMP</h1>
      <p class="subtitle">A brand new adventure is currently in development.</p>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">STATUS</div>
          <div class="stat-value" id="status-val">Loading...</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">PLAYERS</div>
          <div class="stat-value" id="players-val">--/--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">PING</div>
          <div class="stat-value" id="ping-val">-- ms</div>
        </div>
      </div>

      <div class="stats-grid" style="grid-template-columns: 1fr; margin-bottom: 24px;">
        <div class="stat-card">
          <div class="stat-label">TARGET VERSION</div>
          <div class="stat-value" style="color: var(--mc-gold);">26.x</div>
        </div>
      </div>

      <div class="angled-action-bar">
        <button class="angled-btn" onclick="copyIp()">
          <span>SERVER IP</span>
          <span class="btn-subtext" id="ip-subtext">mc.hypixel.net</span>
        </button>

        <button class="angled-btn" onclick="copyDiscord()">
          <span>DISCORD</span>
          <span class="btn-subtext" id="discord-subtext">CLICK TO COPY LINK</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const SERVER_IP = "mc.hypixel.net";
    const DISCORD_URL = "https://discord.gg/v9fGkejqs";

    async function fetchServerStatus() {
      const startTime = Date.now();
      try {
        const response = await fetch(`https://api.mcstatus.io/v2/status/java/${SERVER_IP}`);
        const latency = Date.now() - startTime;
        const data = await response.json();

        const statusVal = document.getElementById("status-val");
        const playersVal = document.getElementById("players-val");
        const pingVal = document.getElementById("ping-val");

        if (data.online) {
          statusVal.textContent = "ONLINE";
          statusVal.className = "stat-value status-online";
          playersVal.textContent = `${data.players.online}/${data.players.max}`;
          pingVal.textContent = `${latency} ms`;
        } else {
          statusVal.textContent = "OFFLINE";
          statusVal.className = "stat-value status-offline";
          playersVal.textContent = "0/0";
          pingVal.textContent = "N/A";
        }
      } catch (err) {
        document.getElementById("status-val").textContent = "ERROR";
      }
    }

    function copyIp() {
      navigator.clipboard.writeText(SERVER_IP);
      const subtext = document.getElementById("ip-subtext");
      subtext.textContent = "COPIED TO CLIPBOARD!";
      setTimeout(() => { subtext.textContent = SERVER_IP; }, 2000);
    }

    function copyDiscord() {
      navigator.clipboard.writeText(DISCORD_URL);
      const subtext = document.getElementById("discord-subtext");
      subtext.textContent = "LINK COPIED!";
      setTimeout(() => { subtext.textContent = "CLICK TO COPY LINK"; }, 2000);
    }

    fetchServerStatus();
    setInterval(fetchServerStatus, 15000);
  </script>
</body>
</html>
