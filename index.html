<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight SMP</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --mc-font: 'Press Start 2P', monospace;
      --mc-gold: #ffaa00;
      --mc-yellow: #ffff55;
      --mc-green: #55ff55;
      --mc-red: #ff5555;
      --btn-dark: #3b1f24;
      --btn-light: #7a2b34;
      --btn-hover: #963541;
      --discord-color: #5865F2;
      --discord-hover: #4752C4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--mc-font);
      image-rendering: pixelated;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      background-color: #121212;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(122, 43, 52, 0.25), transparent 70%),
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url('https://raw.githubusercontent.com/InventivotalentDev/minecraft-assets/1.20/assets/minecraft/textures/block/deepslate.png');
      background-repeat: repeat;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      border: 12px solid #000;
      box-shadow: 
        inset -10px -10px 0px 0px #141414,
        inset 10px 10px 0px 0px #4a4a4a;
    }

    .header-section {
      text-align: center;
      margin-top: 20px;
    }

    .title {
      font-size: clamp(2.2rem, 5vw, 4rem);
      color: var(--mc-gold);
      text-shadow: 4px 4px 0px #3f2a00;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .subtitle {
      color: #aaa;
      font-size: clamp(0.7rem, 1.5vw, 1rem);
      line-height: 1.6;
      text-shadow: 2px 2px 0px #000;
    }

    .main-content {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin: 20px 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background-color: rgba(20, 20, 20, 0.85);
      border: 4px solid #000;
      box-shadow: 
        inset -4px -4px 0px 0px #111,
        inset 4px 4px 0px 0px #333;
      padding: 24px 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.65rem;
      color: #888;
      text-shadow: 1px 1px 0px #000;
      margin-bottom: 14px;
    }

    .stat-value {
      font-size: 1rem;
      color: #fff;
      text-shadow: 2px 2px 0px #000;
    }

    .status-online { color: var(--mc-green); }
    .status-offline { color: var(--mc-red); }

    /* Pixelated Angled Action Bar */
    .angled-action-bar {
      display: flex;
      width: 100%;
      border: 6px solid #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
      background-color: #000;
    }

    .angled-btn {
      flex: 1;
      background-color: var(--btn-dark);
      color: #fff;
      padding: 24px 10px;
      font-size: clamp(0.8rem, 1.8vw, 1.2rem);
      text-shadow: 3px 3px 0px #000;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      position: relative;
      transition: background-color 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .angled-btn:nth-child(2) {
      background-color: var(--discord-color);
      clip-path: polygon(6% 0, 100% 0, 100% 100%, 0% 100%);
      margin-left: -20px;
      padding-left: 30px;
    }

    .angled-btn:hover {
      background-color: var(--btn-hover);
    }

    .angled-btn:nth-child(2):hover {
      background-color: var(--discord-hover);
    }

    .btn-subtext {
      display: block;
      font-size: 0.55rem;
      color: var(--mc-yellow);
      text-shadow: 1px 1px 0px #000;
    }

    @media (max-width: 768px) {
      .angled-action-bar {
        flex-direction: column;
      }
      .angled-btn, .angled-btn:nth-child(2) {
        clip-path: none;
        margin-left: 0;
        padding: 20px;
        border-bottom: 4px solid #000;
      }
    }
  </style>
</head>
<body>

  <div class="header-section">
    <h1 class="title">MOONLIGHT SMP</h1>
    <p class="subtitle">A brand new adventure is currently in development.</p>
  </div>

  <div class="main-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">STATUS</div>
        <div class="stat-value" id="status-val">Loading...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PLAYERS</div>
        <div class="stat-value" id="players-val">--/--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PING</div>
        <div class="stat-value" id="ping-val">-- ms</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">TARGET VERSION</div>
        <div class="stat-value" style="color: var(--mc-gold);">26.x</div>
      </div>
    </div>

    <div class="angled-action-bar">
      <button class="angled-btn" id="ip-btn" onclick="copyIp()">
        <span>SERVER IP</span>
        <span class="btn-subtext" id="ip-subtext">mc.hypixel.net</span>
      </button>

      <button class="angled-btn" id="discord-btn" onclick="copyDiscord()">
        <span>DISCORD</span>
        <span class="btn-subtext" id="discord-subtext">CLICK TO COPY LINK</span>
      </button>
    </div>
  </div>

  <div></div>

  <script>
    const SERVER_IP = "mc.hypixel.net";
    const DISCORD_URL = "https://discord.gg/v9fGkejqs";

    async function fetchServerStatus() {
      const startTime = Date.now();
      try {
        const response = await fetch(`https://api.mcstatus.io/v2/status/java/${SERVER_IP}`);
        const latency = Date.now() - startTime;
        const data = await response.json();

        const statusVal = document.getElementById("status-val");
        const playersVal = document.getElementById("players-val");
        const pingVal = document.getElementById("ping-val");

        if (data.online) {
          statusVal.textContent = "ONLINE";
          statusVal.className = "stat-value status-online";
          playersVal.textContent = `${data.players.online}/${data.players.max}`;
          pingVal.textContent = `${latency} ms`;
        } else {
          statusVal.textContent = "OFFLINE";
          statusVal.className = "stat-value status-offline";
          playersVal.textContent = "0/0";
          pingVal.textContent = "N/A";
        }
      } catch (err) {
        document.getElementById("status-val").textContent = "ERROR";
      }
    }

    function copyIp() {
      navigator.clipboard.writeText(SERVER_IP);
      const subtext = document.getElementById("ip-subtext");
      subtext.textContent = "COPIED TO CLIPBOARD!";
      setTimeout(() => { subtext.textContent = SERVER_IP; }, 2000);
    }

    function copyDiscord() {
      navigator.clipboard.writeText(DISCORD_URL);
      const subtext = document.getElementById("discord-subtext");
      subtext.textContent = "LINK COPIED!";
      setTimeout(() => { subtext.textContent = "CLICK TO COPY LINK"; }, 2000);
    }

    fetchServerStatus();
    setInterval(fetchServerStatus, 15000);
  </script>
</body>
</html>
