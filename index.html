<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight SMP</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --mc-font: 'Press Start 2P', monospace;
      --mc-gold: #ffaa00;
      --mc-yellow: #ffff55;
      --mc-green: #55ff55;
      --mc-red: #ff5555;
      --mc-dark: #1e1e1e;
      --mc-panel: #2c2c2c;
      --discord-purple: #5865F2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--mc-font);
      image-rendering: pixelated;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      background-color: var(--mc-panel);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(85, 85, 255, 0.15), transparent 70%),
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
        url('https://raw.githubusercontent.com/InventivotalentDev/minecraft-assets/1.20/assets/minecraft/textures/block/deepslate.png');
      background-repeat: repeat;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      border: 12px solid #000;
      box-shadow: 
        inset -10px -10px 0px 0px #141414,
        inset 10px 10px 0px 0px #4a4a4a;
    }

    .header-section {
      text-align: center;
      margin-top: 20px;
    }

    .title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      color: var(--mc-gold);
      text-shadow: 5px 5px 0px #3f2a00;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .subtitle {
      color: #aaa;
      font-size: clamp(0.8rem, 2vw, 1.2rem);
      line-height: 1.6;
      text-shadow: 2px 2px 0px #000;
    }

    .main-content {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: 30px 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background-color: var(--mc-dark);
      border: 4px solid #000;
      box-shadow: 
        inset -4px -4px 0px 0px #111,
        inset 4px 4px 0px 0px #333;
      padding: 24px 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-shadow: 1px 1px 0px #000;
      margin-bottom: 14px;
    }

    .stat-value {
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 2px 2px 0px #000;
    }

    .status-online { color: var(--mc-green); }
    .status-offline { color: var(--mc-red); }

    .action-container {
      background-color: var(--mc-dark);
      border: 4px solid #000;
      box-shadow: 
        inset -4px -4px 0px 0px #111,
        inset 4px 4px 0px 0px #333;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .action-text {
      color: var(--mc-yellow);
      font-size: 1rem;
      text-shadow: 2px 2px 0px #000;
      word-break: break-all;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .mc-button {
      background-color: #707070;
      color: #fff;
      border: 4px solid #000;
      box-shadow: 
        inset -3px -3px 0px 0px #383838,
        inset 3px 3px 0px 0px #a8a8a8;
      padding: 14px 24px;
      font-size: 0.8rem;
      cursor: pointer;
      text-shadow: 2px 2px 0px #000;
      text-decoration: none;
      display: inline-block;
    }

    .mc-button:active {
      box-shadow: 
        inset 3px 3px 0px 0px #383838,
        inset -3px -3px 0px 0px #a8a8a8;
    }

    .discord-btn {
      background-color: var(--discord-purple);
      box-shadow: 
        inset -3px -3px 0px 0px #2c3380,
        inset 3px 3px 0px 0px #8892f7;
    }
  </style>
</head>
<body>

  <div class="header-section">
    <h1 class="title">MOONLIGHT SMP</h1>
    <p class="subtitle">A brand new adventure is currently in development.</p>
  </div>

  <div class="main-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">STATUS</div>
        <div class="stat-value" id="status-val">Loading...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PLAYERS</div>
        <div class="stat-value" id="players-val">--/--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PING</div>
        <div class="stat-value" id="ping-val">-- ms</div>
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns: 1fr;">
      <div class="stat-card">
        <div class="stat-label">TARGET VERSION</div>
        <div class="stat-value" style="color: var(--mc-gold);">26.x</div>
      </div>
    </div>

    <div class="action-container">
      <span class="action-text">mc.hypixel.net</span>
      <button class="mc-button" onclick="copyText('mc.hypixel.net', this, 'COPY IP')">COPY IP</button>
    </div>

    <div class="action-container">
      <span class="action-text" style="color: #8892f7;">discord.gg/v9fGkejqs</span>
      <div class="button-group">
        <a href="https://discord.gg/v9fGkejqs" target="_blank" class="mc-button discord-btn">JOIN DISCORD</a>
        <button class="mc-button" onclick="copyText('https://discord.gg/v9fGkejqs', this, 'COPY LINK')">COPY LINK</button>
      </div>
    </div>
  </div>

  <div></div>

  <script>
    const SERVER_IP = "mc.hypixel.net";

    async function fetchServerStatus() {
      const startTime = Date.now();
      try {
        const response = await fetch(`https://api.mcstatus.io/v2/status/java/${SERVER_IP}`);
        const latency = Date.now() - startTime;
        const data = await response.json();

        const statusVal = document.getElementById("status-val");
        const playersVal = document.getElementById("players-val");
        const pingVal = document.getElementById("ping-val");

        if (data.online) {
          statusVal.textContent = "ONLINE";
          statusVal.className = "stat-value status-online";
          playersVal.textContent = `${data.players.online}/${data.players.max}`;
          pingVal.textContent = `${latency} ms`;
        } else {
          statusVal.textContent = "OFFLINE";
          statusVal.className = "stat-value status-offline";
          playersVal.textContent = "0/0";
          pingVal.textContent = "N/A";
        }
      } catch (err) {
        document.getElementById("status-val").textContent = "ERROR";
      }
    }

    function copyText(textToCopy, buttonEl, originalText) {
      navigator.clipboard.writeText(textToCopy);
      buttonEl.textContent = "COPIED!";
      setTimeout(() => { buttonEl.textContent = originalText; }, 2000);
    }

    fetchServerStatus();
    setInterval(fetchServerStatus, 15000);
  </script>
</body>
</html>
